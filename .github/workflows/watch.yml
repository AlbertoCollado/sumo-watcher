name: sumo-watch

on:
  schedule:
    # A) Vigilancia del sumo cada 30 min, 24/7 (hora UTC). Se apaga sola tras el 26 sep 2026.
    - cron: "*/30 * * * *"
    # B) Recordatorios por fecha + resumen semanal, una vez al dia (07:05 UTC = 09:05 en Espana, verano).
    - cron: "5 7 * * *"
  workflow_dispatch:
    inputs:
      reminders:
        description: "Forzar el envio de recordatorios ahora (true/false)"
        required: false
        default: "false"

concurrency:
  group: sumo-watch
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --quiet playwright requests
          python -m playwright install --with-deps chromium

      - name: Vigilancia y recordatorios
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TRIGGER: ${{ github.event.schedule }}
          FORCE_REMINDERS: ${{ github.event.inputs.reminders }}
        run: python check_sumo.py
